 "多账户联动账本", "project": "money-manager", "count": 10, "instruction": "# 离线多账户账本\n\n状态：构题草稿，未冻结。参考 GitHub Money Manager Ex；尚不能正式交给模型作答。\n\n实现完整可运行的 Android 离线账本 App。用户需要管理银行与现金账户，记录收支、账户间转账和交易更正，在交易列表、账户余额及汇总页面得到一致结果。参考页面截图和操作任务书冻结后提供；提交完整工程和可安装 APK。\n\n核心难点是同一交易的生命周期如何影响多个页面。不能把转账记成收入，不能编辑后额外生成重复交易，也不能只改当前页数字而不更新另一账户和重启后的数据。\n\n## 功能契约草稿\n\n| ID | 要求 | 判定关注点 |\n| --- | --- | --- |\n| LG-01 | 使用系统文件入口新建/打开本地账本；权限取消可返回，不能静默覆盖已有账本 | 文件选择、App 返回、重开及取消后的数据状态。原版文件格式兼容要求待冻结 |\n| LG-02 | 创建账户，指定名称、类型、币种、初始余额和开户日期 | 交易归属稳定；不允许早于开户日期的交易；账户显示与余额一致 |\n| LG-03 | 新增收入与支出，填写金额、日期、收付款方、分类、备注和编号 | 金额按精确小数处理；列表、详情、余额、收支汇总同时反映新记录 |\n| LG-04 | 同币种账户间转账，同时更新转出/转入账户 | 总资产不因转账改变，转账不计入收入/支出；更改转账金额后双方均重新计算 |\n| LG-05 | 更正已有交易的金额、日期和分类，取消编辑 | 更正保留交易身份，不新增重复项；取消不改变任何相关账户及汇总 |\n| LG-06 | 保留作废交易的记录并按原版规则处理余额与筛选；支持对账状态 | 作废、未对账、已对账不能混同。具体金额和统计口径待设备核验后冻结 |\n| LG-07 | 按账户、日期、类型或分类查看交易及汇总 | 边界日期明确；筛选不修改底层账本；转账在收入/支出统计中排除 |\n| LG-08 | 创建并选择收付款方和分类，改名不破坏既有交易关联 | 新建后能立即使用；改名/删除约束以原版实测语义为准，不臆造级联规则 |\n| LG-09 | 保存、更换页面、终止进程后重开，以及备份恢复 | 交易和关联账户一致，不重复入账；备份格式及恢复覆盖策略待冻结 |\n| LG-10 | 长列表、软键盘、返回、旋转、深色和字体放大保持关键流程可操作 | 输入不串到账户/交易；已保存结果稳定；视觉与语义证据均需采集 |\n\n本题先限定同币种账户，避免把汇率政策未定义的问题混入账本一致性。云同步、投资行情、第三方支付和付费 API 不在当前草稿范围。完整 App 应包含导航和上述业务闭环，不能以单个静态表单替代。\n\n金额、账户名、交易日期、记录顺序和记录数量会变化。示例数据不是唯一测试数据，不得针对固定编号、备注或截图写死结果。对实现内部类名、数据库表名和 resource-id 不作要求。\n\n## 可理解的例子\n\n活跃交易的金额、身份、取消编辑、日期与筛选口径详见 `input/ledger-contract.md`。该文件包含逐步余额表和剩余待冻结项，与本题面一起阅读。\n\n银行初始1000.00、现金初始100.00；银行入账200.00、支出37.45，再转账80.00到现金。应得到银行1082.55、现金180.00、总额1262.55，收入200.00、支出37.45。把该转账改为60.00后，银行1102.55、现金160.00，总额仍1262.55。随后把原支出改为45.10，银行1094.90、现金160.00、总额1254.90。\n\n以上是草稿中待原版设备核验的业务期望，不是已执行结果。正式题面还需冻结图稿、交易状态口径、平台环境及恢复策略。\n", "operations": "# 操作任务书草稿\n\n以下链路均待完整原版执行，不计入 Golden。\n\n新增交易的前置条件：从指定账户的交易列表点击加号；若使用首页加号，先明确设置默认账户。未设默认且首页快捷新增返回，不作为交易功能失败。此操作任务书尚未完成全部步骤的参考验证，不能用于正式评测。\n\n| 链路 | 用户动作 | 需核验的后果 |\n| --- | --- | --- |\n| 初始化 | 新建独立账本；系统选择文件；取消与重新创建；建银行和现金账户 | 账本身份明确，取消无覆盖，初始余额与开户日期正确 |\n| 收支 | 输入薪酬收入与物料支出，创建收付款方及分类，保存并返回列表 | 记录、金额、账户余额、收入/支出汇总联动 |\n| 转账更正 | 银行向现金转80，再将原转账改为60 | 两个账户均变化，总资产不变，收入/支出不包含该记录，无重复交易 |\n| 交易生命周期 | 修改支出金额，取消另一次修改，作废、对账、筛选后再次查看 | 与冻结状态规则一致；取消不提交，身份不变，汇总口径一致 |\n| 日期与身份 | 开户日前尝试交易；边界日交易；同金额不同备注的多条记录；改分类名 | 非法日期不落账，边界日范围明确，不能按金额误定位或改错交易 |\n| 恢复 | 保存后 force-stop、重开；备份、增加记录、恢复并复核 | 数据按恢复规则完整一致，跨账户转账只存在一份业务记录；非文件存在性判定 |\n\n证据需要新鲜界面树、实际输入、关键截图、账户/交易内容及可解析的用户制品。若使用原版数据库读取辅助核对，不能将内部表结构作为重建模型实现的强制契约。\n\n## 转账与收入共存的状态卡\n\n本组使用独立前置状态：银行期初 1000.00、现金期初 100.00，已经保存一笔银行向现金转账 75.00，当前余额为银行 925.00、现金 175.00。日期为两账户开户日 2026-10-16，当前月无其他收支；没有 Survey Sponsor 收付款方。此初态不同于上方 80 改 60 的轨迹，不能混用。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| LG-I01 | 从首页进入银行账户，点击新增 | Survey Bank | 出现新交易表单，归属银行；既有转账仍为 75.00 | 账户列表、表单归属 |\n| LG-I02 | 选择收入，输入 200.00 并确认金额 | 新交易 | 金额回填 200.00；此时尚未保存交易 | 金额输入与表单 |\n| LG-I03 | 输入备注 Survey funding A，打开收付款方选择 | 待保存收入 | 备注完整保留；可进入实体选择页 | 表单与选择页 |\n| LG-I04 | 新建 Survey Sponsor 并确认 | 收付款方 | 新实体可立即用于当前交易，金额仍为 200.00 | 新建对话框、回填字段 |\n| LG-I05 | 选择 Gifts 分类 | 资助收入 | 分类、收付款方、金额和备注同时保留 | 完整表单 |\n| LG-I06 | 保存收入 | 银行交易列表 | 新收入与原转账同时存在，银行余额 1125.00 | 两条交易及账户余额 |\n| LG-I07 | 返回首页 | 账户与收支汇总 | 银行 1125.00、现金 175.00、总资产 1300.00；收入 200.00、支出 0.00、净收入 200.00 | 按账户身份读取的余额和汇总 |\n| LG-I08 | 保存后终止进程，检查持久化结果并重开 | 两笔交易及关联实体 | 原转账身份与内容不变；仅新增一笔收入，关联正确收付款方与分类；重开结果一致 | 保存制品、身份对比、重开界面 |\n\n以上是操作要求，不代表本组所有证据已完成；特别是持久化读取不能替代重开界面，收入新增不能替代同金额支出更正。完整范围仍包括原表中的取消、作废、对账、筛选和恢复。\n\n## 多记录更正与取消\n\n从 I07 的已保存状态继续：存在转账 75.00 和收入 200.00 两条交易。所有身份比较都指同一业务记录，不强制采用原版内部主键格式。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| LG-M01 | 终止后重开账本并进入银行 | 两条已保存交易 | 银行 1125.00、现金 175.00；收入及转账同时存在 | 重开后的汇总和列表 |\n| LG-M02 | 通过转入账户身份打开原转账，将 75.00 改为 60.00 并保存 | 银行到现金的原转账 | 银行 1140.00、现金 160.00；总资产 1300.00，收入和净收入仍 200.00 | 表单、列表、跨账户汇总 |\n| LG-M03 | 核对两条交易身份和持久化内容 | 转账与收入 | 交易仍只有两条，转账身份不变，仅金额及更新时间可变；收入所有字段不变 | 保存制品及逐记录对比 |\n| LG-M04 | 打开收入，将备注替换为 Discard trial，尝试离开 | 原收入 | 出现确认丢弃的提示；未提交备注不能成为已保存结果 | 修改表单、确认对话框 |\n| LG-M05 | 选择 Keep editing | 同一收入表单 | 留在编辑器，未提交备注 Discard trial 保留 | 表单全文与当前身份 |\n| LG-M06 | 再次尝试离开并选择 Discard | 当前修改 | 返回银行列表，两笔交易金额和余额不变 | 丢弃动作、列表 |\n| LG-M07 | 重开收入 | 原收入 | 备注恢复 Survey funding A，金额 200.00、收付款方 Survey Sponsor、分类 Gifts 均未改变 | 重开表单 |\n| LG-M08 | 停止应用并检查持久化结果 | 两条交易及账户 | 与 M03 后的已保存状态一致，没有隐式提交或重复交易 | 前后保存制品逐记录比较 |\n\n本组尚不证明相同金额、相同类型记录的区分能力；仍需另建两条同金额支出并只更正其中一条。\n\n## 同金额收入的身份区分\n\n本组接在 M08 后：银行 1140.00、现金 160.00，已保存转账 60.00 和收入 A 200.00。收入 A 的备注为 Survey funding A。新建收入 B 时使用同一账户、同一日期、同一收付款方 Survey Sponsor、同一分类 Gifts、同一金额 200.00，仅备注为 Survey funding B。两条记录的显示相似不能导致业务身份合并。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| LG-S01 | 新建并保存收入 B | 银行，收入 200.00，备注 B | A、B 各有独立记录，原转账仍存在；不能把 B 当成更新 A | 保存前表单、保存后两条行记录 |\n| LG-S02 | 核对列表和首页 | 三条交易 | A=200.00、B=200.00、转账=60.00；银行 1340.00、现金 160.00、总资产 1500.00、收入和净收入 400.00、支出 0.00 | 每条备注所在行的金额、账户与统计 |\n| LG-S03 | 停止进程并重开，通过备注 A 选择原收入 | 收入 A | 打开 A 原文与金额 200.00；不能按首个 200.00 或首个收付款方匹配 | 持久化初态、重开列表、编辑器身份 |\n| LG-S04 | 将 A 金额改为 125.00 并保存 | 原收入 A | A=125.00、B=200.00、转账=60.00；仍只有三条记录，A 业务身份不变 | 按备注定位的两条行记录、前后身份 |\n| LG-S05 | 返回首页核对汇总 | 整个账本 | 银行 1265.00、现金 160.00、总资产 1425.00；收入和净收入 325.00、支出 0.00 | 独立金额计算与显示结果 |\n| LG-S06 | 停止应用，比较保存结果 | 全部账户和三条交易 | 仅 A 金额及其更新时间可变；A 其余字段、B 全部字段、原转账全部字段和账户定义不变 | 保存制品逐记录对比 |\n\n更正前后的总额正确仍不足以证明 S04 和 S06：误改 B 也会得到同样总额。该链必须同时检查记录身份。此收入链不替代前述支出、作废、对账与恢复要求。\n", "provenance": "# 来源与证据\n\n参考仓库：https://github.com/moneymanagerex/android-money-manager-ex\n\nCommit：866062b4dbecab72e6b922794c82c2f61f4b7c06；许可证：License。冻结记录见 ../../../evidence/sources-03/source-lock.json；实际构建为 money-manager-build-01，APK minSdk29。\n\n已阅读冻结仓库里的 docs/quickstart/start_standalone.md、docs/usermanual/add_transaction.md、docs/usermanual/concept.md：手册定义账户、收入、支出、转账及状态；明确转账不计入收入/支出、交易不能早于开户日期，描述账本文件创建和账户初始化。手册不是本机行为验收。\n\n实际设备 API29 / emulator-5582：money-explore-01 安装成功、冷启动命令超时；02 采集到原版引导；03 关闭引导进入 General；04 返回新建/打开账本页；05 点击新建后进入系统 DocumentsUI，因未声明窗口包而标记错误，不能作为 App 失败；06 显式采集系统保存页；07 点击 SAVE 回到可选密码页；08 留空密码点 OK，进入空账本首页。账本默认名 your_data_20261016_120355.mmb。未声称交易、余额或恢复已验证。\n\n题包状态 DRAFT；尚缺完整设备链路、输入夹具 划 | 每七天三次的自动休息及平滑强度规则见weekly-binary-contract.md；原始记录与派生状态分离，不得把每天未勾选都视为违约 |\n| HB-05 | 历史修改后重算统计、连续记录和习惯强度 | 改变远期历史也影响后续结果，不只刷新当前单元格。每日数值及每七天三次二值强度的具体公式见两个公开契约；连续记录等其余规则仍待冻结 |\n| HB-06 | 在日期范围内查看历史和图表，处理跨月、跨年和当天边界 | 日期身份按冻结时区一致，不能因页面切换或重启偏移一天 |\n| HB-07 | 编辑目标/周期、归档及恢复习惯 | 历史记录保留；每日数值目标变更追溯重算历史强度，见daily-numeric-contract.md；周期改变及归档恢复规则仍待核验 |\n| HB-08 | 筛选、排序与多选管理 | 排序后编辑仍作用于正确习惯，归档项不混进默认活动列表 |\n| HB-09 | 导出用户可读取历史，备份并恢复 | 导出的日期、值、跳过/缺省、备注与界面一致；恢复后的历史和统计一致。格式与覆盖策略待冻结 |\n| HB-10 | 保存后重启、旋转及放大字体，保持日历和图表可操作 | 真实输入、日期定位与状态稳定，不能以不可交互截图替代图表/日历 |\n\n任务复杂度来自时间序列及派生状态的一致性。`input/history.json`及`input/README.md`已提供跨月、同名习惯、缺省/零/跳过的初始历史与组合操作。具体统计算法、参考图、候选App初始化接入和导出格式仍未冻结，因此当前草稿不可作为可独立作答题。\n\n不依赖在线账户或后端。系统提醒和桌面组件是否纳入最终题目，须先验证参考环境与平台行为，本草稿不以未验证能力补足难度。\n\n每日数值习惯的部分契约已补充于`input/daily-numeric-contract.md`，明确原始状态、强度递推、历史更正及每日数值目标变更。它不替代尚未冻结的每周计划、连续记录、目标方向切换和周期变更规则。\n\n`input/design/coffee-calendar-initial.png`补充原始历史下的日历展开态；日期单元格须可操作，修改应作用于真实记录并更新关联视图。它与首页设计共同提供局部参考，仍不构成完整设计稿。\n\n`input/weekly-binary-contract.md`补充Training每七天三次计划的原始/自动休息状态区分、区间生成及14天平滑强度规则。它不等于自然周清零，也不替代连续记录、月计划或周期变更的完整规格。\n\n`input/design/training-*.png`提供周计划初始详情、日历、日期状态选择框、修改后日历与重启后详情，对应操作卡HB-W01及HB-W05至W07。这些截图与规则共同描述真实状态转换；修改后数值应来自历史重算，不能硬编码37%/34%或10/9。\n", "operations": "# 操作链草稿\n\n以下完整操作链尚未完成验收。每日数值习惯的一条历史更正、重启与导出已完成局部验证，不代表全部参考解通过。\n\n1. 创建每日二值、每周三次和数值习惯，加入两个同名计划；分别录入不同数据。\n2. 在跨月的历史窗口录入完成、未完成、0和跳过，再回首页及详情比较日期和值。\n3. 修改较早的一天，逐页查看后续连续记录、周期完成度和强度重算；导出并对照历史。\n4. 对同一数值分别使用至少/至多目标，检查边界值、撤销及取消编辑。\n5. 排序、归档、恢复、改名后重新定位同名计划，确保记录身份不串换。\n6. 保存、force-stop、重开、备份恢复，再核对历史、统计与用户导出。\n\n日历必须实际点击目标日期，图表必须实际交互；不得通过直接改数据库代替操作。准备历史夹具可以用公开导入入口，但需记录原始文件、解析规则和导入结果。隐藏测试改变日期范围与数值，仍遵守公开算法。\n\n## 已明确的每日数值子链\n\n从原始history.json状态出发，打开Coffee并在日历定位2026-10-15，确认原值4.00与对应备注。修改为1.00并保存，返回历史/统计页，再终止并重启App，检查记录、备注及导出。强度按input/daily-numeric-contract.md重算，修改之前日期不应变化。其他习惯及日期的原始记录全部保持不变，同日不能新增重复记录。\n\n该子链覆盖实际日历输入、历史重算、持久化及导出一致性。它不替代前面的重名习惯、周期计划、归档恢复、目标编辑及布局健壮性操作，也不代表这些要求可以删除。\n\n### 每日数值子链操作卡\n\n以下状态ID用于对齐该子链的操作、截图、语义树与持久化证据；不是整题的完整状态清单。执行前恢复原始history.json，使用UTC日界，初态校验必须包含全部习惯和历史，不能仅依据首页出现Coffee。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| HB-D01 | 导入初始历史后打开首页 | 活动习惯列表 | 同名的两个Read、Training、Coffee分别显示；Practice保持归档 | 首页截图/语义树，全部习惯定义与历史快照 |\n| HB-D02 | 打开Coffee | Coffee详情 | 单位cups、每日目标及备注与初始数据一致 | 详情截图/语义树 |\n| HB-D03 | 展开历史日历 | Coffee日历 | 能定位2026年10月及目标日期；不是静态图片 | 日历截图，展开前后事件与语义树；设计参考coffee-calendar-initial.png |\n| HB-D04 | 点击2026-10-15 | 日期记录编辑框 | 原值4.00，原备注coffee: observation 21 | 编辑框截图及输入控件语义树；未提交前不改数据 |\n| HB-D05 | 将数值改为1.00 | 同一编辑框 | 输入框反映新值，备注保持不变 | 输入事件、编辑框截图/语义树 |\n| HB-D06 | 保存 | 同一习惯同一日期 | 返回日历，目标日及受影响的后续统计刷新；不生成重复记录 | 保存事件、日历与关联视图截图，持久化数据 |\n| HB-D07 | 终止进程后重新启动并打开Coffee | 首页及详情 | 历史更正已保存，习惯身份和其他记录未改变 | 停止/启动记录，重开后的截图/语义树 |\n| HB-D08 | 导出Coffee历史 | 本地用户导出入口 | 导出当前真实历史，日期/数值/备注和重新计算的分数一致 | 实际导出文件、文件哈希、按公开规则独立重算结果；不向外部接收者发送 |\n| HB-D09 | 比较完整持久化状态 | 所有习惯及全部历史 | 只有指定记录数值变化；其他日期、习惯、状态和备注全部保留 | 导出与最终状态快照交叉核验，不以文件存在代替内容检查 |\n\n异常处理：HB-D04原值或备注不符时停止编辑，保留当前截图并检查初态或日期定位，不把其他日期改成预设值来继续流程。应用已经启动但保存无效、数据错误等交互问题保留为能力问题；无法获取设备、初态不一致或证据通道失效则单独记录环境/题目问题。参考App自绘日历的坐标仅属于其设备适配器，候选实现可采用其他布局，不要求同一坐标或内部SQLite字段。\n\n### 目标变更与历史重算操作卡\n\n本链承接HB-D09：Coffee仍为每日至多2杯，10月15日已更正为1杯，其他历史未改动。对照input/daily-numeric-contract.md逐日重算，不把截图中的分数当预言机。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| HB-T01 | 打开Coffee编辑表单 | 目标字段及习惯身份 | 原目标2杯、方向至多、周期每日；名称、提示、单位、备注对应同一习惯 | 表单截图/语义树，参考coffee-edit-initial.png |\n| HB-T02 | 将目标替换为3并保存 | 目标字段及详情 | 输入完整替换；详情显示新目标，其他定义不变 | 输入与保存事件、前后字段及详情截图 |\n| HB-T03 | 终止进程并重开 | Coffee详情 | 新目标持久化，原始历史仍在 | 进程与启动记录、重开截图/语义树 |\n| HB-T04 | 导出并逐日比较 | Coffee全部已有历史 | 整个历史窗口按新目标重算强度，原始值和备注不变；不能只重算当天 | 实际导出与独立计算结果，日期范围与记录集合检查 |\n| HB-T05 | 核对全部习惯和历史 | 目标对象、其他习惯与记录 | 目标对象身份不变；除目标值外其他定义、日期、原始记录及备注全部保持 | 变更前后完整状态比较，不能仅比较条数 |\n\n本链不代表每周计划、方向切换、取消编辑或备份恢复已验证。这些仍属于整题待补齐范围。\n\n### 每七天三次计划的统计核对\n\n这条子链不修改Training原始历史。计算规则见input/weekly-binary-contract.md，不能用每日计划算法替代，也不能按自然周边界截断滚动窗口。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| HB-W01 | 从首页打开Training | 计划详情 | 周期为每七 MEaAAAAMAAARoAAAAwQIAGAAAADBCgAQAAAAMEaAAAAMAAARoAAAAwQIAGAAAADBCgAQAAAAMEaAAAAMAAARoAAAAwQIAGAAAADBCgAQAAAAMEaAAAAMAAARoAAAAwQIAGAAAADBCgAQAAAAMEaAAAAMAAARoAAAAw8N/RjsTHd1KeAwAAAABJRU5ErkJggg==", "image_source": "drafts/mcr-003-habit-history/input/design/coffee-calendar-initial.png", "inputs": ["input/README.md", "input/daily-numeric-contract.md", "input/design/README.md", "input/design/coffee-calendar-initial.png", "input/design/coffee-edit-initial.png", "input/design/imported-history-home.png", "input/design/training-calendar-edited.png", "input/design/training-calendar-initial.png", "input/design/training-detail-edited.png", "input/design/training-detail-initial.png", "input/design/training-record-editor.png", "input/history.json", "input/weekly-binary-contract.md"]}, {"id": "mcr-004-audiobook-library", "title": "有声书播放与恢复", "project": "voice", "count": 10, "instruction": "# 离线有声书书库与播放状态\n\n状态：构题草稿，未冻结。参考 GitHub Voice 8.9.0，交付完整可运行的 Android 有声书 App。不是只显示播放按钮和进度数字的模拟播放器。\n\n用户通过系统目录授权导入书库，在章节之间跳转和定位，为不同书籍保存独立播放位置与书签。切换书籍、返回后台、暂停、重启和重新扫描后，媒体身份与状态必须保持一致，并产生真实音频输出。\n\n| ID | 业务要求 | 可观察结果 |\n| --- | --- | --- |\n| AB-01 | 使用系统目录授权选择书库，取消时不产生伪书籍 | 权限和扫描结果对应实际文件，权限失效可恢复，不靠固定路径绕过授权 |\n| AB-02 | 支持父目录内每个子目录一本书、单个目录一本书及作者/书籍两层目录模式 | 同一组文件在不同模式下分组正确；根目录直接音频文件作为独立书籍。模式切换与重复导入语义待核验 |\n| AB-03 | 按章节组织并播放真实媒体，显示章节/整书位置 | 同名章节在不同书中不混淆；章节顺序、文件名与元数据优先级需冻结 |\n| AB-04 | 播放、暂停、前后跳转、拖动定位和跨章节连续播放 | 音频内容、播放器状态、时间进度一致；不能只改变界面计时器 |\n| AB-05 | 每本书保留独立播放位置，切书再返回、force-stop后恢复 | 书籍身份稳定，进度不串书；完成书籍边界行为按原版核验 |\n| AB-06 | 创建、改名、跳转和删除书签 | 书签绑定书籍、章节和位置；同名书签可区分；跳转后音频内容与位置一致 |\n| AB-07 | 改变播放速度，配置睡眠定时并在结束后继续播放 | 速度影响真实媒体推进；定时触发暂停，暂停后不继续出声；允许误差与淡出语义须实测冻结 |\n| AB-08 | 前后台切换、系统媒体控制及音频焦点变化 | 页面、系统媒体会话和真实播放保持一致；具体焦点/耳机策略需冻结 |\n| AB-09 | 重新扫描书库及处理不可用媒体 | 不重复创建同一书籍，已有进度不无故丢失；损坏或移除文件不导致永久卡死 |\n| AB-10 | 多屏幕、深色、字体放大和旋转下保持可操作性 | 章节列表、书签、进度控件可用，旋转不产生双重播放 |\n\n正式夹具将包括多本多章节、跨书同名章节、不同长度音频和可识别音频内容，带时长与内容清单。必须验证真实音频流，不能以时间数字、播放图标、MediaSession存在或日志中的play作为输出证据。\n\n本题不包括在线听书、付费资源及 Android Auto。原仓库说明 Auto 需要 Play 审核发行版，而本批使用 GitHub flavor；不能把不同发行渠道的能力默认为参考行为。\n\n已提供五个可解码、非静音的本地 MP3 夹具及书库、章节页面参考截图，文件清单见 input/README.md。这些材料仅覆盖部分导入与章节选择状态，不证明真实播放。当前尚缺完整设计图、真实音频采集验证、平台媒体策略和时间容差，草稿不可正式交给模型。\n", "operations": "# 操作链草稿\n\n1. 通过系统选择器分别授权多书目录、单书目录、作者目录；比对实际书籍与章节分组。\n2. 播放书A第一章并记录真实音频，跳至另一章中部，建书签；切换书B同名章节。\n3. 回到书A核对独立进度；从书签跳转，核对实际发声内容，不只看时间标签。\n4. 暂停、继续、变速、章节边界连播，比较媒体推进与墙钟时间；容差实测后冻结。\n5. 设置睡眠定时，等待真实暂停；恢复播放、前后台和系统媒体控制，验证没有双重音频。\n6. 终止进程后重开，重新扫描，再验证书籍身份、进度与书签；处理权限取消和损坏媒体。\n\n以上完整链路仍待设备核验。音频采集能力尚未证明，不得用无音频的屏幕录像代替。系统事件、UiAutomation、原始音频及时间戳应共同留证。\n\n## 已观察的书库与章节状态\n\n前置条件：通过系统文件选择器授权 input/audio-v01/library 对应目录，以 Top-Level Book Mode 导入。以下为参考 App 的局部观察，不是完整链路验收；初次授权流程尚未封装为可重复执行的完整轨迹。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| AB-L01 | 导入完成后查看书库 | 五个 MP3 的书籍分组 | 显示 Field Journal、Weather Notes、Station Log 三本书；初始位于 Not started Yet 分组 | library-imported.png、书库语义树 |\n| AB-L02 | 核对书籍时长 | 三本书的列表行 | Field Journal 与 Weather Notes 显示 01:05，Station Log 显示 00:30 | library-imported.png；实际媒体时长另见夹具清单 |\n| AB-L03 | 打开 Field Journal | 第一章播放器 | 书名 Field Journal，章节 Arrival，位置 0:00，章节时长 0:32，显示 Play 控件 | arrival-paused.png、播放器语义树 |\n| AB-L04 | 打开章节选择器 | Field Journal 的章节 | 提供 Arrival、Return 两章，标识当前章节 | 章节选择器语义树 |\n| AB-L05 | 选择 Return | 第二章播放器 | 章节切换到 Return，显示 0:33 与 Play 控件 | return-paused.png、播放器语义树 |\n| AB-L06 | 停止进程后重开并进入 Field Journal | 已选章节状态 | 书库保留三本书；Field Journal 位于 Current 分组，重开为 Return、0:33、Play | 重启后的书库及播放器语义树 |\n\nL06 的既有观察发生于 AOT 编译和一次启动超时后的独立检查，不能作为干净启动耗时或稳定性通过证据。L03/L05 的 Play 图标仅说明界面处于待播放状态，不能推出真实音频输出、独立播放进度或章节连播正确。\n\n上述观察的维护侧来源：references/voice-exploration.md、voice-library-check.json、voice-chapter-selection.json、voice-restart-state-check.json。公开截图映射见 input/design/README.md。书签、速度、睡眠、系统媒体控制、损坏媒体和跨书进度仍需单独验证。\n", "provenance": "# 来源与缺口\n\n仓库 https://github.com/PaulWoitaschek/Voice；8.9.0 commit aa413505e8b871255fb40a518d3ad2554cb69f9d；许可证 LICENSE.md。实际构建 voice-build-03，GitHub flavor，禁用专有库。voice-main-inspection 不是本题来源。\n\n已读 README.md、docs/index.md、docs/about.md、docs/organizing.md、docs/faq.md。组织手册明确三种目录分组；FAQ说明平台媒体格式、睡眠暂停后的恢复及 Android Auto 的Play限制。源码含 features/bookmark 和 features/sleepTimer；文件存在不证明设备行为。\n\n状态 DRAFT。尚无本机完整播放、音频采集、书签/变速/焦点证据、时间容差、完整设计图和题目验收。不得沿用早期自制小播放器的通过记录来证明本题可解。Golden、错误实现、多模型和独立人工复核均未完成。\n\n局部设备 evidence：voice-explore-16 记录五个音频导入后的三本书；voice-library-check-01 核对书籍身份并打开 Field Journal；voice-chapter-selection-01 核对 Arrival/Return 并选择 Return；voice-restart-state-check-01 观察重开后保留章节选择。三张已检查的截图现列入 input/design，操作卡 AB-L01 至 AB-L06 明确各自证据边界。重启观察经过 AOT 编译和启动超时后的独立检查，不证明干净启动稳定性；模拟器仍为 -no-audio，未验证真实播放。详细过程见维护侧 references/voice-exploration.md。\n\ninput/audio-v01新增5段原创机器旁白，使用已有本机FFmpeg/libflite离线合成；2本各2章加根目录单文件书，跨书章节同名而内容不同。实际逐文件完整解码，约31至34秒，均非静音，含媒体元数据、SHA256、生成命令与工具快照。媒体生成成功不证明Voice播放成功。详细输入说明见 ../input/README.md（相对于题包根目录为 input/README.md）。\n", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAUACAYAAABuzmU9AAAABHNCSVQICAgIfAhkiAAAIABJREFUeJzs3XdclWUfx/EvU0G2EwUn7tyrzFFus7Rh05GZe1dPw8e27WFpamplZcvKcmXDvXJSrhy4yFyICrKRdZ4/fCAO54DccODA4fN+vXw93Ne5z33/4MH8cvG7r8spI8lkEgAAAIB8cbZ3AQAAAEBpQoAGAAAADCBAAwAAAAYQoAEAAAADCNAAAACAAQRoAAAAwAACNAAAAGAAARoAAAAwgAANAAAAGECABgAAAAxwtXcBAAAAKLzIi5G6cuWKxXi5cuXk5+snHx8fOTk52aGy4rX4+8XasHG91ddatWytMSPHFPoeBGgAAIBSJi0tTSfDT+r4ieM6cfKEToafUFJSUp7vcXd3V61atdUgpIE6tO+gKpWrFFO1jscpI8lksncRAAAAyJvJZNL+A/u1cfNGHT9xTKmpqYW6Xv36DXRLl1vUqkUrOTuX/q7eo8eOKiUlRZu3bta+/XutnhMSUl99e/WVq6urGtRvUODPu8QE6OTkZCUlJ8nJyUkVPCvIzc3N3iVlSU1NVXxCvCTJq4JXiaoNAAA4NpPJpN1/7NZPq1Yq8mKkza8f4B+gfrfdrvZt2xdrxjkfcV7HTxyXr4+vmjdrXqhrvfzayzp79oyh91QMqKjXpr9eoPvZtIXj6tWrCjsaptA/Q9WoYSN1vLFjnuenpaUp9M9QbduxTUePhmWNu7u7q2mTG9S1c1c1atioQLVs2LRBW37fkq9zJ42fJD9fP4vxI2FHtGnLJv118EDWT3nu7u5q2aKVbulyi+rWqVug2gAAAPLj4KGDWrpiqc6cOV1k94iKjtIXXy3S9z98p359b1ePbj2KvFc6MzxLUkxsTKGulZKSYjg8S9LlqMuKj4+Xl5eX4fcWOkBnZGTo71N/a8++PdqxY7vi4uMkSfVD6uf5vsTERH32xWfaf2CfxWspKSnas/dP7dn7p+7o11/9+vYzXNeFyAs6d+5svs415ZiEN5lM+unnn7Tql5+s1rZr907t2r1T9w28X91u6Wa4NgAAgOv55bdftHzlsmK7X3Jysn5YukSS1LN7zyK7T/bwbG85M2B+FThAX7p8SXv27tG2Hdt0/vw5Q+81mUxa/P Bi+P9fQuZCodlwFgAAAABJRU5ErkJggg==", "image_source": "drafts/mcr-004-audiobook-library/input/design/arrival-paused.png", "inputs": ["input/README.md", "input/audio-v01/ffmpeg-version.txt", "input/audio-v01/generate-000.log", "input/audio-v01/generate-001.log", "input/audio-v01/generate-002.log", "input/audio-v01/generate-003.log", "input/audio-v01/generate-004.log", "input/audio-v01/generator.py", "input/audio-v01/library/Field Journal/01 Arrival.mp3", "input/audio-v01/library/Field Journal/02 Return.mp3", "input/audio-v01/library/Station Log.mp3", "input/audio-v01/library/Weather Notes/01 Arrival.mp3", "input/audio-v01/library/Weather Notes/02 Return.mp3", "input/audio-v01/manifest.json", "input/audio-v01/probe-000.json", "input/audio-v01/probe-001.json", "input/audio-v01/probe-002.json", "input/audio-v01/probe-003.json", "input/audio-v01/probe-004.json", "input/audio-v01/report.json", "input/audio-v01/scripts/chapter-000.txt", "input/audio-v01/scripts/chapter-001.txt", "input/audio-v01/scripts/chapter-002.txt", "input/audio-v01/scripts/chapter-003.txt", "input/audio-v01/scripts/chapter-004.txt", "input/design/README.md", "input/design/arrival-paused.png", "input/design/library-imported.png", "input/design/return-paused.png"]}, {"id": "mcr-005-multimedia-notes", "title": "多媒体笔记与备份", "project": "omni-notes", "count": 10, "instruction": "# 多媒体笔记的组织、回收与恢复\n\n状态：构题草稿，未冻结。参考 GitHub Omni Notes，实现完整 Android 离线笔记 App。\n\n用户把项目资料整理成文本和清单笔记，附上图片或文件，使用分类与标签检索。归档、回收、恢复、合并和备份后，笔记身份、清单状态与附件都必须保持可用。与文件编辑器题不同，本题重点是笔记对象及其附件、组织关系的生命周期。\n\n| ID | 业务要求 | 判定关注点 |\n| --- | --- | --- |\n| NT-01 | 新建和编辑文本笔记，保存标题和正文，支持同名笔记 | 修改按对象身份定位，同名标题不导致覆盖；取消语义待核验 |\n| NT-02 | 创建清单，添加/编辑/删除条目、完成与撤销完成 | 条目身份和顺序保持，重开后完成状态正确；相同条目文本不混淆 |\n| NT-03 | 使用系统入口添加图片、音频或通用文件附件，并打开或移除 | 内容和类型正确，附件不是占位图；从备份恢复后仍可打开 |\n| NT-04 | 分类和标签组织，多维检索、改名及批量归类 | 列表筛选与详情关系一致，改变组织方式不丢内容或附件 |\n| NT-05 | 按文本检索并打开具体笔记；编辑后重新检索 | 同标题不同内容可定位，搜索作用域含哪些归档/回收状态须冻结 |\n| NT-06 | 归档、移入回收站、恢复和永久删除 | 明确区分可逆和不可逆操作；恢复后清单状态与附件一致；默认列表按状态过滤 |\n| NT-07 | 多选笔记并执行批量操作或合并 | 未选中对象不改变；合并后的正文顺序、组织关系和附件规则需原版核验后公开 |\n| NT-08 | 导出备份，增加或修改数据后恢复 | 笔记、清单状态、分类标签和附件共同恢复；覆盖/合并/重复规则需冻结 |\n| NT-09 | 生命周期与系统共享 | 保存后force-stop、重开及共享入口得到正确内容；公开契约不依赖内部数据库模式 |\n| NT-10 | 长正文、多附件、多选、键盘与返回交互，旋转和字体放大 | 选择状态不误作用于其他笔记，正文和附件可访问，布局不遮挡关键操作 |\n\n正式夹具将包含同名笔记、重复清单条目、不同类型附件及可识别内容。验收需要打开附件并验证内容、执行完整状态转换，不能仅检查缩略图数量或备份文件存在。\n\n云同步不是当前范围：参考仓库把同步列为未来开发，不能把它当作已有参考能力。完整设计截图、合并和恢复策略尚缺，因此这份草稿还不是可独立作答题。\n\n`input/design/checklist-detail.png`提供已经实际核验的清单详情状态，第一项已完成，其余两项未完成。此局部设计与设备证据不替代同名对象、附件、分类标签、多选、合并及备份恢复的完整范围。\n\n`input/lifecycle-contract.md`明确已归档清单经回收站恢复后仍保持归档状态，以及条目和对象身份的保留要求。其他未冻结规则仍须补齐后才能正式交付。\n\n`input/media/`提供同一组原创测量数据的PNG与CSV。附件测试应使用可辨认内容，验证文件归属、完整内容及图片实际打开效果，不得仅按名称和图标数量评分。系统选择器中的筛选标签与目录可能同名，应按正确角色定位。\n", "operations": "# 操作链草稿\n\n1. 创建两份同标题不同正文的笔记和一份含重复文本条目的清单，分别保存。\n2. 给不同笔记添加图片和文件，打开确认实际内容；给清单完成部分条目并重开。\n3. 添加分类标签，筛选、检索、修改正文后再检索，确保打开正确笔记。\n4. 只选择其中一部分归档、移入回收站并恢复；检查未选对象不变以及恢复后的清单和附件。\n5. 合并选中笔记，对照冻结后的顺序及附件规则，再打开附件确认不是失效引用。\n6. 备份、修改当前数据、恢复、force-stop重开；完整核验笔记、清单、组织关系和附件内容。\n\n完整链路仍待验收；一条无附件清单的保存、重启、归档、回收及恢复已实际验证，具体规则见input/lifecycle-contract.md。合并和备份恢复策略不能由评测器私自决定。隐藏样例将变化记录标题、附件名、文本和操作顺序，且所有被评分行为须在公开规则内。\n\n已核验子链：创建Equipment review三项清单，只完成第一项；保存、终止并重开；归档后从Archive打开；移入Trash；再次终止并重开，从Trash恢复。检查仍为原归档对象，三个条目的内容、顺序和完成状态均保留。这不覆盖多笔记误选、标签、附件、永久删除或备份恢复，不能以此代替上述完整操作链。\n\n## 清单、附件与回收的状态链\n\n以下为上述子链及后续附件验证的操作规格，不是整题完成声明。开始前准备input/media中的PNG和CSV，记录原始文件哈希；清单初态不得直接复用上次运行终态。初始化方式和自动清理仍待冻结。\n\n| 状态ID | 动作 | 目标 | 预期状态 | 证据点 |\n| --- | --- | --- | --- | --- |\n| NT-A01 | 创建并保存Equipment review清单 | 新清单 | 按顺序包含Inspect north sensor、Calibrate south sensor、Record calibration result；三项均未完成 | 保存前后截图、条目顺序及对象身份快照 |\n| NT-A02 | 完成第一项后保存 | Inspect north sensor | 仅第一项完成，条目文字和顺序保持；其他两项未完成 | 可辨识勾选状态、保存后完整清单快照 |\n| NT-A03 | 终止进程、重开并打开原清单 | 同一清单 | 标题、三项文字、顺序和完成状态保持 | 启停记录、重开详情与持久化状态比较 |\n| NT-A04 | 归档并从Archive重新打开 | 原清单 | 默认Notes中不再显示，Archive可打开；内容保持 | 两个列表的状态、原对象身份、详情截图 |\n| NT-A05 | 通过系统文件选择器添加PNG和CSV | 已归档清单 | 两份附件归属原清单；不重建笔记，不改变归档和条目状态 | 系统选择器事件、附件归属、原始文件与实际附件内容比较 |\n| NT-A06 | 打开图片附件 | sensor-readings.png | 完整图片可查看，ORBIT-26-A及三条测量记录可辨认 | 实际图片查看器截图、返回路径；缩略图不算通过 |\n| NT-A07 | 返回保存、终止进程并重开 | 含附件的原清单 | 两份附件仍存在，清单和归档状态保持 | 重开详情、对象与附件身份、PNG及CSV完整字节 |\n| NT-A08 | 将清单移入Trash | 原归档清单 | Archive不再列出该对象，Trash可定位；保留其先前归档属性 | 列表切换、回收前后完整状态；不得直接删除重建 |\n| NT-A09 | 终止进程后重新进入Trash | 回收中的原清单 | 回收状态跨重启持久化，仍可恢复同一对象 | 启停日志、Trash条目和持久化状态 |\n| NT-A10 | Restore from trash并从Archive打开 | 原清单及其附件 | 恢复为已归档清单，不自动回默认Notes；三项内容、完成状态和附件归属保持 | 恢复事件、列表归属、原对象及附件身份比较 |\n| NT-A11 | 核对恢复后的附件内容 | PNG与CSV | 两份文件完整内容与输入一致，不以名称、数量或文件存在代替 | 用户可访问附件内容或参考适配器读取结果、逐文件哈希 |\n| NT-A12 | 再次打开恢复后的图片 | 原PNG附件 | 查看器仍能显示完整测量图，返回后仍定位原清单 | 恢复后的查看器截图及导航事件；已完成单样例观察，非自动视觉判分 |\n\nNT-A01至A11来自分次参考探索及持久化核对，尚未形成从干净初态开始的一次完整自动重放。A11的字节核对不能替代A12的用户可打开性。CSV外部查看器没有完成验证，不能由CSV字节一致推断其已通过。\n\n## 身份与异常检查\n\n标题用于定位展示，不能当作唯一身份。正式隐藏样例应增加另一份同标题笔记、另一份含同名附件的清单，并保留未选对象作为对照；这些多对象样例仍待执行。多选、标签、合并和备份恢复继续属于整题范围，不因本链较完整而删除。\n\n文件选择取消后不得出现伪附件；选择器定位有歧义时停止并采集新鲜语义树，不能盲点同名标签。取消分支仍需参考样例确认。进入A08前必须先核对清单身份、归档状态及两附件内容，否则标记初态不一致并停止，不能把错误初态作为模型行为失败。\n\n恢复后如内容或附件失效，应保留有效行为失败及原始证据；只有设备不可用、初态不一致或采集通道失效才归为环境/执行问题。本链不执行永久删除；后续永久删除样例须使用独立可重建初态，不能删除当前参考证据。\n", "provenance": "# 来源与缺口\n\n仓库 https://github.com/federicoiosue/Omni-Notes；commit f2524e0ebdd6a51d8c90f8c98681c0d89f9804a4；许可证 COPYING.txt。实际构建 batch-build-01-omni-notes，FOSS flavor。\n\n已阅读冻结 README.md：明确支持归档/回收/删除、共享/合并/检索、备份导入导出、图片音频文件附件、分类标签与待办清单；同步列为未来开发。assets/help/help.md 仅有标题，没有提供可用详细操作说明，不作为语义依据。\n\n状态 DRAFT。没有本机设备完整操作、合并顺序、恢复策略、附件耐久性、设计截图或输入制品证据。Golden三次、错误变体、隐藏评测、模型试跑和独立人工评分均未完成。源码功能列表不能替代上述验证。\n", "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAUACAYAAABuzmU9AAAAAXNSR0IArs4c6QAAAARzQklUCAgICHwIZIgAACAASURBVHic7N13eFvV/cfxj7yHPGM7thPbCXGGM52QQSAhhL1/bAoUCoTVUspoaaFAyixhBhrKnqVQVqENK1BIGIFAdkL2cmJnOMOOY8t2PPX7w+hG15JsXVve79fzwBNdXV0dS9fWR+d+zzm23CmvOAUAAADAL0Ed3QAAAACgKyFAAwAAABYQoAEAAAALCNAAAACABQRoAAAAwAICNAAAAGABARoAAACwgAANAAAAWECABgAAACwI6egGwLvB2Yk6PDdVUydlanB2omLsYZKknYUO7Sx0aPHyQn01P1/rNxV3cEsBAAB6FhtLeXcuUydl6g+/Ha/0VLtf+y9eXqjnXl2uxcsL27hlAACgMxqcn const tasks=JSON.parse(document.querySelector('#data').textContent);let selected=tasks[0],tab='instruction',url;
const $=s=>document.querySelector(s);
function render(){ $('#title').textContent=selected.title;$('#meta').textContent=selected.id+' · '+selected.project+' · '+selected.count+' 项登记需求';const text=tab==='inputs'?(selected.inputs.join('\n')||'未提供输入素材'):selected[tab];$('#text').textContent=text;$('#figure').hidden=!selected.image;if(selected.image){$('#image').src=selected.image;$('#caption').textContent='既有参考截图，非本批验收证据。来源：'+selected.image_source}document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));document.querySelectorAll('.task').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===selected.id));if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));$('#download').href=url;$('#download').download=selected.id+'-'+tab+'.md';}
function list(){const q=$('#search').value.toLowerCase();$('#list').replaceChildren();const filtered=tasks.filter(t=>(t.title+' '+t.project+' '+t.instruction).toLowerCase().includes(q));for(const t of filtered){const b=document.createElement('button');b.className='task';b.dataset.id=t.id;b.textContent=t.title;const small=document.createElement('small');small.textContent=t.project+' · '+t.count+' 项需求';b.append(small);b.onclick=()=>{selected=t;render()};$('#list').append(b)}$('#empty').hidden=filtered.length>0;render()}
$('#search').addEventListener('input',list);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});list();
